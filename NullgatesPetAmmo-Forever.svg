<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Pet & Ammo - Forever: a paw print and an arrow, with a wild green glow -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#8a5226"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87444"/>
      <stop offset="1" stop-color="#6e4422"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#8b98a8"/>
    </linearGradient>
    <radialGradient id="wild" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9e07a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4f8a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="262" r="190" fill="url(#wild)"/>

  <!-- paw print -->
  <g transform="translate(-6,34)">
    <ellipse cx="206" cy="372" rx="88" ry="14" fill="#000000" opacity="0.35"/>
    <g fill="#d9a066" opacity="0.45" filter="url(#glow)">
      <path d="M206 250 C262 250 296 300 288 334 C282 360 252 356 206 356 C160 356 130 360 124 334 C116 300 150 250 206 250 Z"/>
    </g>
    <g fill="url(#paw)" stroke="#4e2c12" stroke-width="5">
      <path d="M206 250 C262 250 296 300 288 334 C282 360 252 356 206 356 C160 356 130 360 124 334 C116 300 150 250 206 250 Z"/>
      <ellipse cx="120" cy="226" rx="26" ry="34" transform="rotate(-22 120 226)"/>
      <ellipse cx="168" cy="180" rx="27" ry="37" transform="rotate(-8 168 180)"/>
      <ellipse cx="244" cy="180" rx="27" ry="37" transform="rotate(8 244 180)"/>
      <ellipse cx="292" cy="226" rx="26" ry="34" transform="rotate(22 292 226)"/>
    </g>
    <g fill="#ffffff" opacity="0.35">
      <ellipse cx="180" cy="280" rx="24" ry="10" transform="rotate(-18 180 280)"/>
      <ellipse cx="160" cy="166" rx="7" ry="12"/>
      <ellipse cx="236" cy="166" rx="7" ry="12"/>
    </g>
  </g>

  <!-- arrow, rising from lower left to upper right across the paw -->
  <g transform="rotate(-42 256 256)">
    <rect x="76" y="248" width="330" height="16" rx="8" fill="#b9e07a" opacity="0.4" filter="url(#glow)"/>
    <rect x="96" y="249" width="300" height="14" rx="7" fill="url(#shaft)" stroke="#3e2410" stroke-width="3"/>
    <!-- head -->
    <path d="M392 226 L452 256 L392 286 L404 256 Z" fill="url(#steel)" stroke="#4a5562" stroke-width="4" stroke-linejoin="round"/>
    <!-- fletching -->
    <path d="M100 250 L160 250 L140 222 L80 222 Z" fill="#6fa83a" stroke="#2f4f14" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 262 L160 262 L140 290 L80 290 Z" fill="#4f8a24" stroke="#2f4f14" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 236 L144 236 M100 276 L144 276" stroke="#2f4f14" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- leaves -->
  <path d="M398 360 q30 -6 44 16 q-30 8 -44 -16 Z" fill="#8cc152"/>
  <path d="M116 112 q24 -14 46 2 q-24 16 -46 -2 Z" fill="#8cc152" opacity="0.85"/>
  <circle cx="420" cy="140" r="6" fill="#d4ef9f"/>
  <circle cx="96" cy="404" r="5" fill="#d4ef9f" opacity="0.8"/>
</svg>
